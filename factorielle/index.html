<title>Calculateur de factorielle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: une seule colonne centrée, carte de saisie puis résultat en dessous */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #16202c;
  --muted: #5b6878;
  --line: #d9dfe7;
  --accent: #1f5fbf;
  --accent-soft: #e4edfa;
  --error: #b42318;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #93a0b2;
    --line: #2a3442; --accent: #6ea2ff; --accent-soft: #1c2a40; --error: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #93a0b2;
  --line: #2a3442; --accent: #6ea2ff; --accent-soft: #1c2a40; --error: #ff8a7a;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px;
  line-height: 1.5;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1 { font-family: var(--font-display); font-size: 2rem; margin: 0; text-wrap: balance; }
h1 .bang { color: var(--accent); }
.lead { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
label { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
input {
  flex: 1 1 160px; min-width: 0; font: 500 1.25rem var(--font-mono); padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: 600 1rem var(--font-body); border-radius: 8px; cursor: pointer; }
.primary { background: var(--accent); color: var(--surface); border: 0; padding: 10px 22px; }
.primary:hover { filter: brightness(1.08); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .9rem; }
.chip { background: var(--accent-soft); color: var(--accent); border: 0; padding: 4px 12px; font: 500 .9rem var(--font-mono); }
.error { color: var(--error); margin: 0; font-size: .95rem; }
.formula { font-family: var(--font-mono); color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.value {
  font: 500 1.5rem/1.4 var(--font-mono); margin: 0; overflow-wrap: anywhere; word-break: break-all;
  max-height: 320px; overflow-y: auto; font-variant-numeric: tabular-nums;
}
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 6px 14px; font-size: .9rem; }
.note { color: var(--muted); font-size: .85rem; margin: 0; }
</style>

<main>
  <header>
    <h1>Factorielle n<span class="bang">!</span></h1>
    <p class="lead">Entrez un entier n pour obtenir n! = n × (n−1) × … × 2 × 1.</p>
  </header>

  <form class="card" id="form" novalidate>
    <label for="n">Valeur de n</label>
    <div class="row">
      <input id="n" type="number" inputmode="numeric" min="0" max="5000" step="1" value="10">
      <button class="primary" type="submit">Calculer</button>
    </div>
    <div class="chips">Exemples :
      <button type="button" class="chip" data-n="5">5</button>
      <button type="button" class="chip" data-n="10">10</button>
      <button type="button" class="chip" data-n="20">20</button>
      <button type="button" class="chip" data-n="100">100</button>
    </div>
    <p class="error" id="error" hidden></p>
  </form>

  <section class="card" id="result" aria-live="polite">
    <p class="formula" id="formula"></p>
    <p class="value" id="value"></p>
    <div class="meta">
      <span id="digits"></span>
      <button type="button" class="ghost" id="copy">Copier</button>
    </div>
  </section>

  <p class="note">Calcul exact en entiers de précision arbitraire, pour 0 ≤ n ≤ 5000. Par convention, 0! = 1.</p>
</main>

<script>
const MAX = 5000;
const $ = id => document.getElementById(id);

function factorielle(n) {
  let r = 1n;
  for (let i = 2n; i <= BigInt(n); i++) r *= i;
  return r;
}

function formule(n) {
  if (n <= 1) return `${n}! = 1`;
  if (n <= 8) return `${n}! = ` + Array.from({ length: n }, (_, i) => n - i).join(' × ');
  return `${n}! = ${n} × ${n - 1} × ${n - 2} × … × 2 × 1`;
}

function calculer() {
  const raw = $('n').value.trim();
  const n = Number(raw);
  const err = $('error');
  if (raw === '' || !Number.isInteger(n) || n < 0) {
    err.textContent = 'Entrez un entier positif ou nul (par exemple 7).';
    err.hidden = false; $('result').hidden = true; return;
  }
  if (n > MAX) {
    err.textContent = `n est trop grand : la limite est ${MAX}.`;
    err.hidden = false; $('result').hidden = true; return;
  }
  err.hidden = true;
  const s = factorielle(n).toString();
  $('formula').textContent = formule(n) + ' =';
  $('value').textContent = s;
  $('digits').textContent = `${s.length} chiffre${s.length > 1 ? 's' : ''}`;
  $('copy').textContent = 'Copier';
  $('result').hidden = false;
}

$('form').addEventListener('submit', e => { e.preventDefault(); calculer(); });
document.querySelectorAll('.chip').forEach(b =>
  b.addEventListener('click', () => { $('n').value = b.dataset.n; calculer(); }));
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('value').textContent); $('copy').textContent = 'Copié'; }
  catch { const r = document.createRange(); r.selectNodeContents($('value'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent = 'Sélectionné'; }
});

calculer();
</script>
